<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chilipir - Erori de preț și Reduceri</title>
    
    <!-- Tailwind CSS pentru design rapid și modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome pentru iconițe -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Configurare culori personalizate -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#e63946', // Roșu agresiv pentru conversie
                        dark: '#1d3557',  // Albastru închis premium
                    }
                }
            }
        }
    </script>
    <style>
        /* Efect de zoom fin pe poze la hover */
        .card-img-hover:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">

    <!-- Header / Navigare -->
    <header class="bg-dark text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bolt text-brand text-2xl"></i>
                <h1 class="text-2xl font-bold tracking-tight">Chilipir<span class="text-brand">Hub</span></h1>
            </div>
            <!-- Modifică link-ul de mai jos cu link-ul canalului tău de Telegram -->
            <a href="https://t.me/canalul_tau" target="_blank" class="bg-[#0088cc] hover:bg-[#0077b5] text-white px-4 py-2 rounded-full font-medium transition-colors text-sm flex items-center gap-2 shadow-md">
                <i class="fa-brands fa-telegram"></i> Alerte Live
            </a>
        </div>
    </header>

    <!-- Hero Section -->
    <div class="bg-dark text-center py-12 px-4 border-t border-gray-700">
        <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-4">Descoperim ofertele pe care magazinele vor să le ascundă.</h2>
        <p class="text-gray-300 max-w-2xl mx-auto text-lg">Erori de preț, lichidări de stoc și reduceri masive actualizate automat de AI.</p>
    </div>

    <!-- Grila de Produse -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div id="grid-produse" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Loader vizual până se descarcă JSON-ul -->
            <div class="col-span-full text-center py-10">
                <i class="fa-solid fa-circle-notch fa-spin text-brand text-4xl mb-3"></i>
                <p class="text-gray-500 font-medium">Căutăm cele mai noi oferte...</p>
            </div>
        </div>
    </main>

    <script>
        function formateazaPret(pret) {
            if (!pret) return '0 Lei';
            return parseFloat(pret).toLocaleString('ro-RO') + ' Lei';
        }

        function genereazaCard(produs) {
            // Suport pentru diferite moduri în care bot-ul ar putea trimite datele
            const titluScurt = produs.titlu || produs.nume_produs || "Ofertă Ascunsă";
            const pozaProdus = produs.poza || "https://via.placeholder.com/300x300?text=Imagine+Indisponibila";
            const linkOferta = produs.link || produs.url || "#";
            const reducere = produs.reducere || 0;
            const pretNou = produs.pret_nou || produs.pret || 0;
            const pretVechi = produs.pret_vechi || 0;

            return `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden relative flex flex-col group border border-gray-100">
                    <!-- Badge Reducere -->
                    <div class="absolute top-3 left-3 bg-brand text-white text-xs font-bold px-3 py-1.5 rounded-full z-10 shadow-md">
                        -${reducere}%
                    </div>
                    
                    <!-- Imagine -->
                    <div class="h-48 overflow-hidden bg-white flex items-center justify-center p-4">
                        <img src="${pozaProdus}" alt="${titluScurt}" class="max-h-full object-contain transition-transform duration-500 card-img-hover">
                    </div>
                    
                    <!-- Detalii -->
                    <div class="p-5 flex flex-col flex-grow border-t border-gray-50">
                        <h3 class="text-sm font-semibold text-gray-800 line-clamp-2 mb-3 h-10" title="${titluScurt}">${titluScurt}</h3>
                        
                        <div class="mt-auto">
                            <div class="flex items-baseline gap-2 mb-4">
                                <span class="text-2xl font-black text-brand">${formateazaPret(pretNou)}</span>
                                <span class="text-sm text-gray-400 line-through">${formateazaPret(pretVechi)}</span>
                            </div>
                            
                            <a href="${linkOferta}" target="_blank" class="block w-full text-center bg-gray-900 hover:bg-brand text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm">
                                Vezi Oferta <i class="fa-solid fa-arrow-right ml-1 text-sm"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // Citim datele trimise de botul Python
        async function incarcaOferte() {
            const grid = document.getElementById('grid-produse');
            try {
                // '?t=' forțează browserul să nu folosească memoria cache, afișând mereu cele mai noi date urcate de bot
                const response = await fetch('oferte.json?t=' + new Date().getTime());
                
                if (!response.ok) throw new Error('Fișierul JSON nu a putut fi încărcat.');
                
                const oferte = await response.json();
                grid.innerHTML = ''; // Curățăm spinner-ul de încărcare
                
                if (oferte.length === 0) {
                    grid.innerHTML = '<p class="text-center col-span-full text-gray-500 font-medium mt-10">Momentan nu există oferte noi. Revino mai târziu!</p>';
                    return;
                }

                oferte.forEach(produs => {
                    grid.innerHTML += genereazaCard(produs);
                });

            } catch (error) {
                console.error("Eroare:", error);
                grid.innerHTML = '<div class="col-span-full text-center mt-10"><p class="text-gray-500 font-medium text-lg">Bot-ul scanează rețeaua. Momentan nu există oferte afișate.</p><p class="text-sm text-gray-400 mt-2">(Așteptăm ca scriptul Python să uploadeze prima ofertă)</p></div>';
            }
        }

        incarcaOferte();
    </script>
</body>
</html>
