<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chilipir - Erori de preț și Reduceri</title>
    
    <!-- Tailwind CSS pentru design rapid și modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome pentru iconițe -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Configurare culori personalizate -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#e63946', // Roșu agresiv pentru conversie
                        dark: '#1d3557',  // Albastru închis premium
                    }
                }
            }
        }
    </script>
    <style>
        /* Efect de zoom fin pe poze la hover */
        .card-img-hover:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">

    <!-- Header / Navigare -->
    <header class="bg-dark text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-bolt text-brand text-2xl"></i>
                <h1 class="text-2xl font-bold tracking-tight">Chilipir<span class="text-brand">Hub</span></h1>
            </div>
            <a href="https://t.me/canalul_tau" target="_blank" class="bg-[#0088cc] hover:bg-[#0077b5] text-white px-4 py-2 rounded-full font-medium transition-colors text-sm flex items-center gap-2 shadow-md">
                <i class="fa-brands fa-telegram"></i> Alerte Live
            </a>
        </div>
    </header>

    <!-- Hero Section -->
    <div class="bg-dark text-center py-12 px-4 border-t border-gray-700">
        <h2 class="text-3xl md:text-4xl font-extrabold text-white mb-4">Descoperim ofertele pe care magazinele vor să le ascundă.</h2>
        <p class="text-gray-300 max-w-2xl mx-auto text-lg">Erori de preț, lichidări de stoc și reduceri masive actualizate automat de AI.</p>
    </div>

    <!-- Grila de Produse -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div id="grid-produse" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
            <!-- Produsele vor fi injectate aici prin JavaScript -->
        </div>
    </main>

    <script>
        // Aici scriptul Python va urca fișierul JSON. 
        // Pentru vizualizarea de test, folosim aceste date simulate:
        const oferteDeTest = [
            {
                titlu: "Invertor hibrid Huawei SUN2000-6KTL-L1, 6kW, Monofazat",
                poza: "https://s13emagst.akamaized.net/products/41198/41197779/images/res_5ce5e6f6631b1420cd156dbd28e7e1e4.jpg",
                pret_nou: 3450,
                pret_vechi: 4890,
                reducere: 29,
                link: "#"
            },
            {
                titlu: "Husa de protectie US Polo Shiny pentru Samsung Galaxy S20 Ultra",
                poza: "https://s13emagst.akamaized.net/products/28438/28437943/images/res_0442387da7382d56d2b51cc2d6006f15.jpg",
                pret_nou: 45,
                pret_vechi: 120,
                reducere: 62,
                link: "#"
            },
            {
                titlu: "Televizor LG OLED evo C3, 139 cm, Smart, 4K Ultra HD",
                poza: "https://s13emagst.akamaized.net/products/44778/44777595/images/res_fba70a25f9d7842323cc67a6855146c9.jpg",
                pret_nou: 4999,
                pret_vechi: 6499,
                reducere: 23,
                link: "#"
            },
            {
                titlu: "Trusa de scule YATO, 108 piese, Otel CrV",
                poza: "https://s13emagst.akamaized.net/products/930/929497/images/res_e7f3c1bdf74cb97e59b2b512030f9a2e.jpg",
                pret_nou: 199,
                pret_vechi: 350,
                reducere: 43,
                link: "#"
            }
        ];

        function formateazaPret(pret) {
            return pret.toLocaleString('ro-RO') + ' Lei';
        }

        function genereazaCard(produs) {
            return `
                <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden relative flex flex-col group border border-gray-100">
                    <!-- Badge Reducere -->
                    <div class="absolute top-3 left-3 bg-brand text-white text-xs font-bold px-3 py-1.5 rounded-full z-10 shadow-md">
                        -${produs.reducere}%
                    </div>
                    
                    <!-- Imagine -->
                    <div class="h-48 overflow-hidden bg-white flex items-center justify-center p-4">
                        <img src="${produs.poza}" alt="Produs" class="max-h-full object-contain transition-transform duration-500 card-img-hover">
                    </div>
                    
                    <!-- Detalii -->
                    <div class="p-5 flex flex-col flex-grow border-t border-gray-50">
                        <h3 class="text-sm font-semibold text-gray-800 line-clamp-2 mb-3 h-10">${produs.titlu}</h3>
                        
                        <div class="mt-auto">
                            <div class="flex items-baseline gap-2 mb-4">
                                <span class="text-2xl font-black text-brand">${formateazaPret(produs.pret_nou)}</span>
                                <span class="text-sm text-gray-400 line-through">${formateazaPret(produs.pret_vechi)}</span>
                            </div>
                            
                            <a href="${produs.link}" target="_blank" class="block w-full text-center bg-gray-900 hover:bg-brand text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm">
                                Vezi Oferta <i class="fa-solid fa-arrow-right ml-1 text-sm"></i>
                            </a>
                        </div>
                    </div>
                </div>
            `;
        }

        // Randare carduri in HTML
        const grid = document.getElementById('grid-produse');
        oferteDeTest.forEach(produs => {
            grid.innerHTML += genereazaCard(produs);
        });
    </script>
</body>
</html>
